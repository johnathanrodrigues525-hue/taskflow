{% extends 'core/base.html' %}
{% block conteudo %}
<h2>{% if projeto %}Editar{% else %}Novo{% endif %} Projeto</h2>
<form method="post">
    {% csrf_token %}
    <label>Nome *</label>
    <input name="nome" required value="{{ projeto.nome|default:'' }}">

    <label>Descrição</label>
    <textarea name="descricao">{{ projeto.descricao|default:'' }}</textarea>

    <label>Responsável *</label>
    <input name="responsavel" required value="{{ projeto.responsavel|default:'' }}">

    <label>Data de Início *</label>
    <input type="date" name="data_inicio" required
           value="{{ projeto.data_inicio|date:'Y-m-d' }}">

    <label>Data de Término</label>
    <input type="date" name="data_fim" value="{{ projeto.data_fim|date:'Y-m-d' }}">

    <label>Status</label>
    <select name="status">
        <option value="planejado" {% if projeto.status == 'planejado' %}selected{% endif %}>Planejado</option>
        <option value="andamento" {% if projeto.status == 'andamento' %}selected{% endif %}>Em Andamento</option>
        <option value="concluido" {% if projeto.status == 'concluido' %}selected{% endif %}>Concluído</option>
    </select>

    <br><br>
    <button class="btn" type="submit">Salvar</button>
    <a class="btn btn-secondary" href="{% url 'lista_projetos' %}">Cancelar</a>
</form>
{% endblock %}
