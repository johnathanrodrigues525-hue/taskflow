<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}TaskFlow{% endblock %}</title>
    <style>
        body { font-family: Arial; background: #f4f6f8; margin: 0; color: #333; }
        header { background: #2c3e50; color: #fff; padding: 15px 30px;
                 display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; }
        nav a { color: #ecf0f1; text-decoration: none; margin-left: 15px; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 15px; }
        th { background: #3498db; color: #fff; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .btn { display: inline-block; padding: 7px 14px; background: #3498db;
               color: #fff; text-decoration: none; border: none; border-radius: 4px;
               cursor: pointer; font-size: 14px; }
        .btn:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #95a5a6; }
        form label { display: block; margin-top: 12px; font-weight: 600; }
        form input, form select, form textarea {
            width: 100%; padding: 9px; margin-top: 4px;
            border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 10px 15px; background: #d4edda; color: #155724;
                       border-radius: 4px; margin-bottom: 10px; }
        .badge { padding: 3px 9px; border-radius: 12px; font-size: 12px; color: #fff; }
        .b-planejado, .b-pendente { background: #95a5a6; }
        .b-andamento, .b-executando { background: #f39c12; }
        .b-concluido, .b-concluida { background: #27ae60; }
        .cards { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .card { flex: 1 1 200px; background: #fff; padding: 20px;
                border-radius: 8px; text-align: center;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .card h3 { margin: 0; color: #7f8c8d; }
        .card p { font-size: 32px; margin: 8px 0 0; color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>📋 TaskFlow</h1>
        <nav>
            <a href="{% url 'home' %}">Início</a>
            <a href="{% url 'lista_projetos' %}">Projetos</a>
            <a href="{% url 'lista_tarefas' %}">Tarefas</a>
        </nav>
    </header>
    <main>
        {% if messages %}
            <ul class="messages">
                {% for m in messages %}<li>{{ m }}</li>{% endfor %}
            </ul>
        {% endif %}
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
